---
databases:
  - database: "test"
    dialect: "hive"
    namespace: "public"
    # whats the primary key/ forgein key / this is forgein key and whats refer to.
    # validate key violation.
    # schema, vaildate forgein key relationship
    # constrain .
    # types and key information.
    # Clipping operator, certain columns most k record of that conibation, most K record
    # example in RA
    # list of relational operator.

    # elimiate dependency on chorus.
    #
    tables:
      - table: "orders"
        columns:
          - name: "order_id"
          - name: "order_date"
            canRelease: true
          - name: "customer_id"
            IsForgienKey: true
            ForgienKeyRelationShip: "customer:customer_ID"
            Type: int
            bound: [ 10,100 ]
          - name: "product_id"
            domainSet: "products.product_id"
          - name: "quantity"
          - name: "order_cost"
      - table: "products"
        isPublic: true
        columns:
          - name: "product_id"
          - name: "name"
          - name: "price"
      - table: "customers"
        columns:
          - name: "customer_id"
          - name: "name"
          - name: "address"

