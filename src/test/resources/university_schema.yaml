    tables:
      - table: "department"
        primary_key: ["dep_id"]
        columns:
          - name: "dep_id"
            type: string
            type_params:
              max_length: 10
              nullable: false
          - name: "name"
            type: string
            type_params:
              max_length: 100
              unique: true
              nullable: false
          - name: "building"
            type: string
            type_params:
              max_length: 50
              nullable: true

      - table: "faculty"
        primary_key: ["fac_id"]
        columns:
          - name: "fac_id"
            type: string
            type_params:
              max_length: 10
              nullable: false
          - name: "name"
            type: string
            type_params:
              max_length: 100
              nullable: false
          - name: "email"
            type: string
            type_params:
              max_length: 100
              unique: true
              nullable: false
          - name: "rank"
            type: categorical
            type_params:
              values: ['Assistant Professor', 'Associate Professor', 'Professor', 'Lecturer']
              nullable: false
          - name: "dep_id"
            type: string
            type_params:
              max_length: 10
              nullable: false
              references: "department.dep_id"
          - name: "salary"
            type: decimal
            type_params:
              precision: 10
              scale: 2
              lower: 0
              upper: 500000
              nullable: false
          - name: "retben"
            type: string
            type_params:
              max_length: 1000
              nullable: true

      - table: "course"
        primary_key: ["crs_id"]
        columns:
          - name: "crs_id"
            type: string
            type_params:
              max_length: 10
              nullable: false
          - name: "title"
            type: string
            type_params:
              max_length: 100
              nullable: false
          - name: "description"
            type: string
            type_params:
              max_length: 1000
              nullable: true
          - name: "credit"
            type: int
            type_params:
              lower: 0
              upper: 6
              nullable: false
          - name: "dep_id"
            type: string
            type_params:
              max_length: 10
              nullable: false
              references: "department.dep_id"

      - table: "section"
        primary_key: ["sec_id"]
        columns:
          - name: "sec_id"
            type: string
            type_params:
              max_length: 10
              nullable: false
          - name: "crs_id"
            type: string
            type_params:
              max_length: 10
              nullable: false
              references: "course.crs_id"
          - name: "fac_id"
            type: string
            type_params:
              max_length: 10
              nullable: true
              references: "faculty.fac_id"
          - name: "term"
            type: categorical
            type_params:
              values: ['Fall', 'Spring', 'Summer', 'Winter']
              nullable: false
          - name: "year"
            type: int
            type_params:
              lower: 2000
              upper: 2100
              nullable: false
          - name: "time"
            type: string
            type_params:
              max_length: 20
              nullable: true
          - name: "location"
            type: string
            type_params:
              max_length: 50
              nullable: true

      - table: "student"
        primary_key: ["stu_id"]
        columns:
          - name: "stu_id"
            type: string
            type_params:
              max_length: 10
              nullable: false
          - name: "name"
            type: string
            type_params:
              max_length: 100
              nullable: false
          - name: "email"
            type: string
            type_params:
              max_length: 100
              unique: true
              nullable: false
          - name: "level"
            type: int
            type_params:
              lower: 1
              upper: 5
              nullable: false
          - name: "dep_id"
            type: string
            type_params:
              max_length: 10
              nullable: false
              references: "department.dep_id"
          - name: "finaid"
            type: decimal
            type_params:
              precision: 10
              scale: 2
              lower: 0
              upper: 100000
              nullable: true

      - table: "enrollment"
        primary_key: ["stu_id", "sec_id"]
        columns:
          - name: "stu_id"
            type: string
            type_params:
              max_length: 10
              nullable: false
              references: "student.stu_id"
          - name: "sec_id"
            type: string
            type_params:
              max_length: 10
              nullable: false
              references: "section.sec_id"
          - name: "grade"
            type: categorical
            type_params:
              values: ['A+', 'A', 'A-', 'B+', 'B', 'B-', 'C+', 'C', 'C-', 'D+', 'D', 'D-', 'F', 'W', 'I']
              nullable: true